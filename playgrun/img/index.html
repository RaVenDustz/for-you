<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #000; /* พื้นหลังสีดำแบบในคลิป */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
        }

        .image-box {
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
        }

        #display-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* ทำให้ภาพพิกเซลดูแตกแบบตั้งใจเมื่อใช้รูปเล็ก */
            image-rendering: pixelated; 
            transition: all 0.3s ease;
        }

        .controls {
            background-color: #f0f0f0;
            padding: 5px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            color: #333;
        }

        select {
            border: none;
            background: transparent;
            font-size: 16px;
            padding: 5px 10px;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }

        .label-text {
            font-size: 14px;
            margin-bottom: 10px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="label-text">ปรับความชัด</div>
        
        <div class="image-box">
            <img id="display-image" src="https://via.placeholder.com/20/808080/FFFFFF?text=." alt="loading">
        </div>

        <div class="controls">
            <select id="res-selector" onchange="changeResolution()">
                <option value="144">144p</option>
                <option value="240">240p</option>
                <option value="720">720p</option>
                <option value="1080">1080p ✨</option>
            </select>
        </div>
    </div>

    <script>
        function changeResolution() {
            const selector = document.getElementById('res-selector');
            const img = document.getElementById('display-image');
            const val = selector.value;

            // เปลี่ยนลิงก์รูปภาพตามเงื่อนไข
            // แนะนำ: เอารูปไปฝากไว้ที่เว็บฝากรูป หรือใส่ไว้ในโฟลเดอร์เดียวกับไฟล์นี้แล้วแก้ path เอาครับ
            if (val === "144") {
                img.src = "img/144.png"; 
            } else if (val === "240") {
                img.src = "img/unnamed.png";
            }
                else if (val === "720") {
                img.src = "img/720.png";
            } 
            else if (val === "1080") {
                img.src = "img/sp.jpg"; 
                
            } else {
                img.src = "img/world-high.png";
            }
        }

        // รันครั้งแรกเพื่อให้แสดงรูปเริ่มต้น
        window.onload = changeResolution;
    </script>
</body>
</html>
